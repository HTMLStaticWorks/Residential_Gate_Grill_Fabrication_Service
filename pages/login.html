<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login to Scala Gate &amp; Grill Studio — Access your custom metal fabrications, site measurements, and project proposals." />
  <title>Login — Scala Gate &amp; Grill Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23181818%22/><path d=%22M25 80V35c0-5 5-10 10-10h30c5 0 10 5 10 10v45M40 25v55M60 25v55M25 50h50M25 65h50%22 stroke=%22%23ae9e7c%22 stroke-width=%226%22 stroke-linecap=%22round%22 fill=%22none%22/></svg>">
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/dark-mode.css" />
  <link id="rtl-stylesheet" rel="stylesheet" href="../assets/css/rtl.css" disabled />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<div class="auth-container">
  <div class="auth-form-side">
    <!-- Auth Page Toggles (RTL & Theme) -->
    <div class="auth-controls">
      <button class="nav-icon-btn" onclick="window.Scala.RTLManager.toggle()" title="Toggle RTL" aria-label="Toggle RTL" style="font-size: 0.78rem; font-weight: 550;">RTL</button>
      <button class="nav-icon-btn" onclick="window.Scala.ThemeManager.toggle()" title="Toggle Theme" aria-label="Toggle theme">
        <i class="theme-toggle-icon fas fa-moon"></i>
      </button>
    </div>

    <div class="auth-form-container">
      <a href="../index.html" class="auth-logo">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px; height:22px; color:#fff; display:block;">
            <path d="M3 21h18" stroke="currentColor" stroke-width="2"/>
            <path d="M5 21V5c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2v16" stroke="currentColor" stroke-width="2"/>
            <line x1="9" y1="3" x2="9" y2="21" stroke="currentColor" stroke-width="1.5"/>
            <line x1="15" y1="3" x2="15" y2="21" stroke="currentColor" stroke-width="1.5"/>
            <line x1="5" y1="9" x2="19" y2="9" stroke="currentColor" stroke-width="1.5"/>
            <line x1="5" y1="15" x2="19" y2="15" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 6c1-1 3-1 4 0M13 6c1-1 3-1 4 0" stroke="var(--accent)" stroke-width="1.2" fill="none"/>
            <path d="M7 12c1-1 3-1 4 0M13 12c1-1 3-1 4 0" stroke="var(--accent)" stroke-width="1.2" fill="none"/>
          </svg>
        </div>
        <span class="brand-name">Scala <span>Gate &amp; Grill</span></span>
      </a>

      <h1 class="auth-title">Sign In</h1>
      <p class="auth-subtitle">Sign in to access your gate and safety grill bookings, site survey dimensions, and custom project proposals.</p>

      <!-- Login form -->
      <form data-validate-form>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" data-validate="required,email" autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-toggle">
            <input type="password" id="password" class="form-control" placeholder="Enter your password" data-validate="required,minLength:6" autocomplete="current-password" />
            <button type="button" class="toggle-btn fas fa-eye" aria-label="Toggle password visibility"></button>
          </div>
        </div>
        <div class="form-group" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; margin-bottom: 1.5rem;">
          <div class="checkbox-group">
            <input type="checkbox" id="remember" />
            <label for="remember" style="font-size: .88rem; color: var(--text-secondary); cursor: pointer;">Remember me</label>
          </div>
          <a href="#" style="font-size: .85rem; color: var(--primary); font-weight: 500; text-decoration: none;">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-bottom:1.5rem;">
          Login
        </button>
        <div class="auth-divider">or continue with</div>

        <div class="social-signin">
          <button class="social-btn" type="button"><i class="fab fa-google"></i> Google</button>
          <button class="social-btn" type="button"><i class="fab fa-apple"></i> Apple</button>
        </div>
      </form>

      <div class="auth-footer">
        New to Scala Gate &amp; Grill? <a href="register.html">Create an account</a>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/main.js"></script>
</body>
</html>
