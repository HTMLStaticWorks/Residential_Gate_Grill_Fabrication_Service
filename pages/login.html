<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login to Royal Gates Studio — Access your custom metal fabrications, site measurements, and project proposals." />
  <title>Login — Royal Gates Studio</title>
  <link rel="icon" type="image/png" href="../assets/images/favicon.png">
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/dark-mode.css" />
  <link id="rtl-stylesheet" rel="stylesheet" href="../assets/css/rtl.css" disabled />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

<div class="auth-container">
  <div class="auth-form-side">
    <!-- Auth Page Toggles (RTL & Theme) -->
    <div class="auth-controls">
      <button class="nav-icon-btn" onclick="window.Scala.RTLManager.toggle()" title="Toggle RTL" aria-label="Toggle RTL" style="font-size: 0.78rem; font-weight: 550;">RTL</button>
      <button class="nav-icon-btn" onclick="window.Scala.ThemeManager.toggle()" title="Toggle Theme" aria-label="Toggle theme">
        <i class="theme-toggle-icon fas fa-moon"></i>
      </button>
    </div>

    <div class="auth-form-container">
      <a href="../index.html" class="auth-logo">
        <div class="brand-logo"><img src="../assets/images/logo.png" alt="Royal Gates Logo"></div>
      <span class="brand-name">Royal Gates</span>
      </a>

      <h1 class="auth-title">Sign In</h1>
      <p class="auth-subtitle">Sign in to access your gate and safety grill bookings, site survey dimensions, and custom project proposals.</p>

      <!-- Login form -->
      <form data-validate-form>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="" data-validate="required,email" autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-toggle">
            <input type="password" id="password" class="form-control" placeholder="" data-validate="required,minLength:6" autocomplete="current-password" />
            <button type="button" class="toggle-btn fas fa-eye" aria-label="Toggle password visibility"></button>
          </div>
        </div>
        <div class="form-group" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; margin-bottom: 1.5rem;">
          <div class="checkbox-group">
            <input type="checkbox" id="remember" />
            <label for="remember" style="font-size: .88rem; color: var(--text-secondary); cursor: pointer;">Remember me</label>
          </div>
          <a href="#" style="font-size: .85rem; color: var(--primary); font-weight: 500; text-decoration: none;">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-bottom:1.5rem;">
          Login
        </button>
        <div class="auth-divider">or continue with</div>

        <div class="social-signin">
          <button class="social-btn" type="button"><i class="fab fa-google"></i> Google</button>
          <button class="social-btn" type="button"><i class="fab fa-apple"></i> Apple</button>
        </div>
      </form>

      <div class="auth-footer">
        New to Royal Gates? <a href="register.html">Create an account</a>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/main.js"></script>
</body>
</html>
